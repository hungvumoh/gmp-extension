<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GMP-NN Quick View</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background: #525659; 
            font-family: sans-serif;
        }
        #header {
            background: #222;
            color: white;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            height: 30px;
        }
        iframe { 
            width: 100%; 
            height: calc(100% - 46px); 
            border: none; 
        }
        .close-hint {
            background: #dc3545;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="header">
        <span>🔍 Đang xem nhanh (Toàn màn hình)</span>
        <span class="close-hint">Nhấn ESC để Đóng</span>
    </div>
    <iframe id="viewer"></iframe>
    <script src="fullscreen_viewer.js"></script>
</body>
</html>
